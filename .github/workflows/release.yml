name: Release

# Push a tag `v<version>` matching Cargo.toml to publish a release (see docs/RELEASING.md).
# A tag with a dash (`v0.2.0-beta1`) becomes a pre-release, which the in-app update check ignores.
on:
  push:
    tags: ['v*']

# Each job declares what it needs; only `publish` can write.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag must match the Cargo.toml version and point at a commit on main
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

  build:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      platforms: '["windows-latest"]'

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: YTDugem-windows-x86_64
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          for file in YTDugem-windows-x86_64.zip YTDugem-windows-x86_64-setup.exe; do
            test -f "$file" || { echo "::error::Missing $file in the build artifact"; exit 1; }
            sha256sum "$file" > "$file.sha256"
          done
          cat ./*.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          flags=(--repo "$GITHUB_REPOSITORY" --title "YTDugem ${tag#v}" --generate-notes --verify-tag)
          case "$tag" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$tag" \
            dist/YTDugem-windows-x86_64-setup.exe dist/YTDugem-windows-x86_64-setup.exe.sha256 \
            dist/YTDugem-windows-x86_64.zip dist/YTDugem-windows-x86_64.zip.sha256 \
            "${flags[@]}"
