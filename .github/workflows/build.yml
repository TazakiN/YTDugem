name: Build

# Build, test and package YTDugem. Called by check.yml (CI) and release.yml.
on:
  workflow_call:
    inputs:
      platforms:
        description: JSON list of runner images to build on
        type: string
        default: '["ubuntu-latest", "windows-latest"]'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Check Windows packaging selection and extraction commands
        run: python scripts/test-package-windows.py
      - name: Check runtime tool update selection
        run: python scripts/test-update-runtime.py
      - name: Package Windows audio tools
        if: runner.os == 'Windows'
        env:
          SEVENZIP: 'C:\Program Files\7-Zip\7z.exe'
        run: python scripts/package-windows.py
      - name: Test extracted Windows package playback without installed tools
        if: runner.os == 'Windows'
        run: ./scripts/windows-playback-smoke.ps1
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Build and test the installer
        if: runner.os == 'Windows'
        run: ./scripts/build-installer.ps1 -Test -NoGui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: YTDugem-windows-x86_64
          path: |
            dist/YTDugem-windows-x86_64.zip
            dist/YTDugem-windows-x86_64-setup.exe
