[package]
name = "ytdugem"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "YTDugem music player, a native Rust desktop rewrite of BitChord"

[dependencies]
anyhow = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.31", default-features = false, features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
directories = "6"
rand = "0.9"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
sha1 = "0.10"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# `cargo run` stays responsive: image decoding, egui and TLS run optimized even in debug builds.
[profile.dev.package."*"]
opt-level = 3
